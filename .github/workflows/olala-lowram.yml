name: Olala low-RAM mode

# Native build of the Olala CPU path (MSVC on Windows) and the expert
# paging test (tests/test-olala-moe-paging.cpp) on Windows, macOS and Linux.

on:
  workflow_dispatch:
  push:
    branches: [olala-master]
    paths:
      - '.github/workflows/olala-lowram.yml'
      - 'ggml/src/ggml-cpu/**'
      - 'ggml/src/ggml.c'
      - 'ggml/include/ggml.h'
      - 'src/models/olala.cpp'
      - 'src/llama-model-loader.cpp'
      - 'src/llama-mmap.cpp'
      - 'tests/test-olala-moe-paging.cpp'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paging:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_TESTS=ON -DLLAMA_CURL=OFF -DLLAMA_OPENSSL=OFF

      - name: Build
        run: cmake --build build --config Release -j 4 --target test-olala-moe-paging llama-server llama-cli llama-bench

      - name: Expert paging test (Unix)
        if: runner.os != 'Windows'
        run: ./build/bin/test-olala-moe-paging

      - name: Expert paging test (Windows)
        if: runner.os == 'Windows'
        run: .\build\bin\Release\test-olala-moe-paging.exe
